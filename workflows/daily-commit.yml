name: Daily Commit

on:
  schedule:
    - cron: "0 11 * * *"
      timezone: "Asia/Tehran"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create daily commit
        run: |
          echo "Daily commit: $(date '+%Y-%m-%d %H:%M:%S')" >> daily-commits.txt

      - name: Commit and push
        run: |
          git config user.name "Sadaf Amini"
          git config user.email "YOUR_GITHUB_EMAIL"
          git add daily-commits.txt
          git commit -m "chore: daily commit"
          git push
